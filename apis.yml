aid: xtype
name: Xtype
description: >-
  xtype is an automated governance platform for ServiceNow, giving enterprises
  visibility, control, orchestration, and compliance across every instance in
  their ServiceNow estate — tracking changes, access decisions, and
  configurations and enforcing policy in real time. Products include xtype
  Enterprise and the free xtype View. The company is backed by ServiceNow
  Ventures, Columbia Capital, Norwest Venture Partners, Inner Loop Capital, and
  SaaS Venture Capital, with offices in Covina (CA), Tel Aviv, and Vienna.
  xtype publishes no public developer API: api.xtype.io is a live Kong gateway
  with no publicly documented routes.
